stages: [test, build]

unit:
  stage: test
  image: golang:1.24
  script:
    - test -z "$(gofmt -l cmd internal pkg examples test)"
    - go test -short -race -coverprofile=coverage.out ./...
    - go vet ./...
  artifacts:
    paths: [coverage.out]

image:
  stage: build
  image: docker:27-cli
  services: [docker:27-dind]
  variables:
    DOCKER_TLS_CERTDIR: /certs
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" .
